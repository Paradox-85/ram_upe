rules:
  - id: rule.element.unique_stable_id
    description: "Every element ID must be unique, lowercase, stable, and match ^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+$."
    severity: error

  - id: rule.element.allowed_type
    description: "Every element type must be declared in vocabulary.element_types."
    severity: error

  - id: rule.relationship.allowed_type
    description: "Every relationship type must be declared in vocabulary.relationship_types."
    severity: error

  - id: rule.relationship.valid_endpoints
    description: "Every relationship source and target must resolve to an element ID in this document."
    severity: error

  - id: rule.provenance.source_boundary
    description: "Evidence references must be _plan/main.md or descendants of knowledge-base/raw-input; synthesis must be labeled."
    severity: error

  - id: rule.workstream.explicit_dependencies
    description: "Every Workstream must declare dependencies, including an empty list for a root workstream."
    severity: error

  - id: rule.workstream.measured
    description: "Every Workstream must have at least one measured_by relationship to an Outcome."
    severity: error

  - id: rule.risk.mitigation_and_owner
    description: "Every Risk must define an early indicator, mitigation, accountable workstream, and incoming mitigates relationship."
    severity: error

  - id: rule.architecture.what_how_boundary
    description: "Product names may occur only in evidence, candidate mappings, or elements explicitly marked layer: how and replaceability: required."
    severity: error

  - id: rule.information.explicit_authority
    description: "Any implementation that duplicates state must identify the authoritative field owner and expose projection freshness."
    severity: warning

  - id: rule.pilot.exit_criterion
    description: "Every Opportunity must define a testable exit criterion before scale funding."
    severity: error